[package]
name = "wackcode"
version = "1.2.0"
description = "A local desktop UI for the Pi coding agent"
authors = ["Intelios"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "wackcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Only for build.rs's read of runtime-lock.json; the same version as the regular dependency.
serde_json = "1"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.30", features = ["signal", "process"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
    "NSAttributedString",
    "NSNotification",
    "NSOperation",
    "NSRunLoop",
    "NSTimer",
    "block2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSColor",
    "NSBitmapImageRep",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSAccessibility",
    "NSAttributedString",
    "NSBezierPath",
    "NSFont",
    "NSPanel",
    "NSScreen",
    "NSStringDrawing",
    "block2",
    "libc",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "WKContentWorld",
    "WKFrameInfo",
    "WKSnapshotConfiguration",
    "WKWebView",
] }
block2 = "0.6"
# Computer use (`computer_use/`): input events, window lists, Accessibility and per-window capture.
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGGeometry",
    "CGImage",
    "CGRemoteOperation",
    "CGSession",
    "CGWindow",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
] }
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "macos-private-api", "protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

tempfile = "3"
unicode-normalization = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
portable-pty = "0.9"
