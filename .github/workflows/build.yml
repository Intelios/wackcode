# Builds the Apple Silicon macOS app, packages it as a disk image, attaches it
# to a GitHub release, then rebuilds intelios.github.io so the download shows up.
#
# Opt-in per release: put <!-- build --> anywhere in the release notes before
# publishing. To build a release that's already out, run this workflow from the
# Actions tab and enter its tag.

name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. 1.0.2)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.body, '<!-- build -->')
    runs-on: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Its automatic cache looks for pnpm, which isn't installed until the next step.
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build:desktop

      # Tauri's own dmg would be packed before scripts/sign-runtime.mjs
      # re-signs the bundled Node, so the image is made from the final app.
      - name: Package disk image
        run: |
          staging=$(mktemp -d)
          ditto src-tauri/target/release/bundle/macos/WackCode.app "$staging/WackCode.app"
          ln -s /Applications "$staging/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname WackCode -srcfolder "$staging" -format UDZO -ov "WackCode-$TAG-macos.dmg" && break
            sleep 10
          done
          test -f "WackCode-$TAG-macos.dmg"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "WackCode-$TAG-macos.dmg" --clobber -R "$GITHUB_REPOSITORY"

  rebuild-site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_REBUILD_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Intelios/Intelios.github.io/dispatches \
            -d '{"event_type":"rebuild"}'
        env:
          SITE_REBUILD_TOKEN: ${{ secrets.SITE_REBUILD_TOKEN }}
