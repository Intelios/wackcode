[package]
name = "wack-web"
description = "The web tools: web_fetch and web_search, and the guard that keeps them on the public internet."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wack-agent.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
dom_query.workspace = true
dom_smoothie.workspace = true
htmd.workspace = true
encoding_rs.workspace = true

[dev-dependencies]
flate2 = "1"
tokio = { workspace = true, features = ["test-util"] }
