[package]
name = "wackcode"
version = "0.1.0"
description = "A local desktop UI for the Pi coding agent"
authors = ["Jack"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "wackcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.30", features = ["signal", "process"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSColor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
unicode-normalization = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
portable-pty = "0.9"

