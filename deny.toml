# `cargo deny check licenses`: fails on any dependency licence that is not listed here.
# WackCode is AGPL-3.0, so permissive and GPL-3.0-compatible licences are all acceptable.

[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "bzip2-1.0.6",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    # Permissive data licence: webpki-roots (Mozilla's root certificates), only in the build-time
    # downloader that fetches CEF (download-cef, under cef-dll-sys). Nothing in the app uses it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The list says what would be acceptable, not only what is in the tree today.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished and covered by LICENSE.txt.
ignore = true
