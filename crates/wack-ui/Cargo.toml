[package]
name = "wack-ui"
description = "GPUI views, the pane tree and layout solver, theme and components."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Compiles in the dev-only automation socket (docs/testing.md). Never enabled in a release build.
automation = ["dep:async-channel", "dep:base64"]
# The socket's screenshots, which need GPUI's test mode: it draws after every event, not once a
# refresh, so a dev app with it feels less smooth than a release build. `cargo dev --smooth` leaves it out.
screenshots = ["automation", "gpui/test-support"]

[dependencies]
wack-core.workspace = true
wack-browser.workspace = true
wack-computer.workspace = true
wack-canvas.workspace = true
# The window's NSView, which browser pages live in (browser.rs). Already in the build through GPUI.
raw-window-handle = "0.6"
gpui.workspace = true
gpui_tokio.workspace = true
futures.workspace = true
# The ledger's retry loop sleeps between attempts, on the engine's runtime (app.rs).
tokio.workspace = true
unicode-segmentation = "1"
serde_json.workspace = true
regex.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
# Grammars only, with the pure-Rust regex engine: colours come from the theme, not syntect.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
serde.workspace = true
# Reads macOS's Reduce Motion setting (motion.rs). Already in the build through GPUI.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace", "NSView", "NSResponder"] }
# Finds GPUI's overlay view among the window's subviews (browser.rs). Already in the build through GPUI.
objc2 = "0.6"
# Moves memory notes to the Trash (memory_page.rs). Already in the build through GPUI.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSArray", "NSEnumerator"] }
async-channel = { version = "2", optional = true }
# The automation socket's browser command decodes DevTools screenshots.
base64 = { version = "0.22", optional = true }
# The automation socket encodes screenshots; the gallery draws its fixture backdrop.
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
