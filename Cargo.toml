[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "3.0.0-dev.0"
edition = "2024"
publish = false

[workspace.dependencies]
wack-llm = { path = "crates/wack-llm" }
wack-agent = { path = "crates/wack-agent" }
wack-tools = { path = "crates/wack-tools" }
wack-core = { path = "crates/wack-core" }
wack-ui = { path = "crates/wack-ui" }
wack-web = { path = "crates/wack-web" }
wack-mcp = { path = "crates/wack-mcp" }
wack-browser = { path = "crates/wack-browser" }
wack-canvas = { path = "crates/wack-canvas" }
wack-computer = { path = "crates/wack-computer" }
wack-catalog = { path = "crates/wack-catalog" }

# GPUI comes from one pinned revision of zeronsh/zui, a standalone extraction of Zed's GPUI that
# adds backdrop blur, edge fade and transparent-window support. All three crates must share the
# same rev. Bumping it is its own task, never part of feature work: see docs/gpui.md.
gpui = { git = "https://github.com/zeronsh/zui", rev = "15ee7082c4f910618be306166436a6d9fe0451be" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "15ee7082c4f910618be306166436a6d9fe0451be", features = [
    # Shaders compile at launch, so building needs only the Command Line Tools, not full Xcode.
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "15ee7082c4f910618be306166436a6d9fe0451be" }

async-trait = "0.1"
futures = "0.3"
# TLS trusts the system's certificate store rather than a bundled list, so certificates the user
# has installed are honoured.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
tokio-util = "0.7"
tempfile = "3"
libc = "0.2"
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The usage ledger's record ids: the published contract says UUID, and its readers parse them.
uuid = { version = "1", features = ["v4"] }
# Skill frontmatter: the SKILL.md files other tools write use the whole of YAML (folded
# descriptions, lists, nested metadata), which a line reader would get wrong.
yaml-rust2 = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }
url = "2"
# MCP: the catalogue cache's file names and the hash that keeps a shortened tool name unique.
sha2 = "0.10"
# web_fetch: HTML to Markdown. dom_query parses and cleans the page, dom_smoothie (a port of
# Firefox's Readability) finds the article in it, htmd writes the Markdown, encoding_rs decodes
# pages that are not UTF-8.
dom_query = "0.29"
dom_smoothie = "0.19"
htmd = "0.5"
encoding_rs = "0.8"
# The terminal pane's emulator: the grid, escape sequences, the PTY. Drawing is ours.
alacritty_terminal = "0.26"
# The browser's engine: CEF (Chromium Embedded Framework) through tauri-apps/cef-rs. The crate's
# version pins the CEF and Chromium release; the build downloads that CEF once into
# `target/cef` (`CEF_PATH` in .cargo/config.toml). Bumping it is its own task, never part of
# feature work: see docs/cef.md. Default features are off: `build-util` pulls in anyhow and
# clap, and we bundle with `cargo xtask` instead.
cef = { version = "=156.6.0", default-features = false, features = ["sandbox"] }
cef-dll-sys = { version = "=156.6.0", default-features = false }
# Backdrop pictures: decoded once on import, scaled down and stored as JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[profile.dev]
# Line tables keep file:line in panics without the multi-gigabyte cost of full debug info.
debug = "line-tables-only"

# GPUI is unusably slow unoptimized, so dependencies are always optimized; our crates stay fast to build.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
