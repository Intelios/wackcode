[package]
name = "wack-browser"
description = "The browser engine: CEF (Chromium) lifetime and profile, each chat's tabs, in-process DevTools, and the agent's address policy."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wack-web.workspace = true
wack-agent.workspace = true
wack-llm.workspace = true
async-trait.workspace = true
base64 = "0.22"
cef.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
libc.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSGeometry", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSApplication", "NSEvent", "NSGraphics", "NSWindow"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
