[package]
name = "wackcode"
description = "WackCode: a native macOS coding agent."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Dev only: compiles in the automation socket (docs/testing.md). `cargo dev` turns on both;
# `cargo dev --smooth` only `automation`, so the app draws as a release build does.
automation = ["wack-ui/automation"]
screenshots = ["automation", "wack-ui/screenshots", "gpui_platform/test-support"]

[dependencies]
wack-ui.workspace = true
wack-core.workspace = true
wack-browser.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
